version: 1
backend:
  phases:
    build:
      commands:
        # Retrieve existing client configuration without pushing backend changes.
        - amplify pull --appId d3atqfo9c31ej3 --envName prod --yes
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - '.next/cache/**/*'
      - '.npm/**/*'
