version: 1
backend:
  phases:
    build:
      commands:
        - 'true'
frontend:
  phases:
    preBuild:
      commands:
        - aws s3 cp s3://amplify-mockdraft-prod-8022f-deployment/website/aws-exports.js src/aws-exports.js
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - '.next/cache/**/*'
      - '.npm/**/*'
